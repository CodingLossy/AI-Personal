name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: OpenAPI document is up to date
        run: |
          pnpm --filter @ai-personal/server openapi:export
          git diff --exit-code -- apps/server/openapi/v1.json
      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi-v1
          path: apps/server/openapi/v1.json

  compliance:
    name: license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SPDX headers and package.json license/author
        run: pnpm check:spdx
      - name: Leftover placeholders
        run: pnpm check:placeholders
      - name: No credentials in recorded fixtures
        run: pnpm check:secrets
      - name: Dependency license allowlist and telemetry denylist
        run: pnpm check:licenses
      - name: REUSE compliance
        uses: fsfe/reuse-action@v5

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: >
          docker build -f docker/Dockerfile -t ai-personal:ci
          --build-arg SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          .
      - name: Run and check /healthz, auth, data dir, user and idle memory
        run: |
          set -x
          docker run -d --name aip -p 127.0.0.1:8787:8787 ai-personal:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/healthz
          curl -fsS http://127.0.0.1:8787/api/v1/meta
          STATUS="$(curl -fsS http://127.0.0.1:8787/api/v1/auth/status)"
          grep -q '"initialized":false' <<<"$STATUS"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/v1/auth/me)" = "401"
          docker exec aip test -f /data/db.sqlite
          LOGS="$(docker logs aip 2>&1)"
          grep -q 'one-time setup code' <<<"$LOGS"
          test "$(docker inspect -f '{{.Config.User}}' aip)" = "node"
          sleep 10
          RSS_KB=$(docker exec aip sh -c 'grep VmRSS /proc/1/status' | awk '{print $2}')
          echo "Idle RSS: $((RSS_KB / 1024)) MiB"
          test "$RSS_KB" -lt $((120 * 1024))
      - name: Memory breakdown (informational)
        continue-on-error: true
        run: |
          docker run --rm ai-personal:ci node --input-type=module -e "
          const mb = () => Math.round(process.memoryUsage().rss / 1048576);
          const heap = () => Math.round(process.memoryUsage().heapUsed / 1048576);
          const row = (label) => console.log(label.padEnd(22), 'rss', String(mb()).padStart(4), 'MiB  heap', String(heap()).padStart(4), 'MiB');
          row('node baseline');
          for (const m of ['/app/packages/storage/node_modules/better-sqlite3/lib/index.js', '@ai-personal/storage', 'pino', 'hono', '@hono/node-server', '@hono/zod-openapi', './dist/app.js']) {
            await import(m);
            row('+ ' + m.replace(/^.*node_modules\//, '').replace('/lib/index.js', ''));
          }
          "
      - name: Show container status and logs
        if: failure()
        run: |
          docker ps -a --filter name=aip
          docker logs aip || true
      - name: Remove container
        if: always()
        run: docker rm -f aip || true
